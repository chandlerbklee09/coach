<h2>개인정보처리방침</h2>
<p>풍등코칭(이하 "회사")은 고객의 개인정보를 중요시하며, 다음과 같은 목적에 따라 개인정보를 수집하고 이용합니다.</p>

<h3>1. 수집 항목</h3>
<ul>
  <li>필수 항목: 이름, 이메일, 전화번호, 결제 정보</li>
  <li>수집 방법: 상담 신청서 및 결제 시 입력</li>
</ul>

<h3>2. 이용 목적</h3>
<ul>
  <li>코칭 서비스 제공 및 운영</li>
  <li>고객 응대 및 결제 관련 안내</li>
</ul>

<h3>3. 보유 기간</h3>
<p>관련 법령에 따른 보관 기간을 제외하고, 수집일로부터 1년간 보관 후 안전하게 파기합니다.</p>
